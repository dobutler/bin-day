# Builds the game and publishes dist/ to GitHub Pages.
#
# Note on private repos: Pages can only publish from a *private* repository
# on GitHub Pro (personal accounts) or Team/Enterprise (organisations). On a
# free personal account the repo must be public for this workflow to deploy.
# Until then, keep the repo private and run it locally with `npm run dev`,
# or point Cloudflare Pages / Netlify at the private repo instead.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
